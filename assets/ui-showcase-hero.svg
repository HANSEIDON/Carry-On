<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <linearGradient id="windowBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f17"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="ticketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdfbf7"/>
      <stop offset="100%" stop-color="#f4eee5"/>
    </linearGradient>
    <linearGradient id="passportCover" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14261c"/>
      <stop offset="100%" stop-color="#0c1811"/>
    </linearGradient>
    <linearGradient id="goldText" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#f3e5ab"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Outer Canvas Background -->
  <rect width="960" height="540" rx="16" fill="#080b11"/>

  <!-- Desktop App Window Frame -->
  <g filter="url(#cardShadow)">
    <rect x="40" y="30" width="880" height="480" rx="12" fill="url(#windowBg)" stroke="#1f293d" stroke-width="2"/>
    
    <!-- Titlebar -->
    <rect x="40" y="30" width="880" height="36" rx="12" fill="#0e1420"/>
    <rect x="40" y="54" width="880" height="12" fill="#0e1420"/>
    <line x1="40" y1="66" x2="920" y2="66" stroke="#1f293d" stroke-width="1"/>

    <!-- Window Controls (Win11 style) -->
    <circle cx="62" cy="48" r="5.5" fill="#ef4444" opacity="0.8"/>
    <circle cx="80" cy="48" r="5.5" fill="#f59e0b" opacity="0.8"/>
    <circle cx="98" cy="48" r="5.5" fill="#10b981" opacity="0.8"/>
    <text x="480" y="52" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12" font-weight="500" text-anchor="middle">Carry On — In Flight (ICN → HND)</text>
  </g>

  <!-- Main Content Layout (Split View: Left Navigation & Ticket / Right Flight Monitor & Passport) -->

  <!-- Card 1: Boarding Pass with Tearable Stub (Left side) -->
  <g transform="translate(70, 95)" filter="url(#cardShadow)">
    <!-- Ticket Body -->
    <rect width="360" height="190" rx="8" fill="url(#ticketGrad)" stroke="#dcd5c9" stroke-width="1.5"/>
    
    <!-- Airline Header -->
    <rect width="360" height="38" rx="8" fill="#1e293b"/>
    <rect y="30" width="360" height="8" fill="#1e293b"/>
    <text x="20" y="24" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="12" font-weight="800" letter-spacing="1">HANUL AIR</text>
    <text x="230" y="24" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10" font-weight="600">BOARDING PASS</text>

    <!-- Flight Info -->
    <text x="20" y="65" fill="#64748b" font-family="monospace" font-size="9" font-weight="600">FROM</text>
    <text x="20" y="92" fill="#0f172a" font-family="-apple-system, sans-serif" font-size="24" font-weight="800">ICN</text>
    <text x="20" y="108" fill="#475569" font-family="-apple-system, sans-serif" font-size="10">Seoul / Incheon</text>

    <!-- Flight Path Icon -->
    <path d="M 95 82 L 125 82" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="3,3"/>
    <polygon points="125,78 135,82 125,86" fill="#94a3b8"/>

    <text x="145" y="65" fill="#64748b" font-family="monospace" font-size="9" font-weight="600">TO</text>
    <text x="145" y="92" fill="#0f172a" font-family="-apple-system, sans-serif" font-size="24" font-weight="800">HND</text>
    <text x="145" y="108" fill="#475569" font-family="-apple-system, sans-serif" font-size="10">Tokyo / Haneda</text>

    <!-- Grid Details -->
    <line x1="20" y1="124" x2="240" y2="124" stroke="#e2dcd2" stroke-width="1"/>
    <text x="20" y="142" fill="#64748b" font-family="monospace" font-size="8">FLIGHT</text>
    <text x="20" y="158" fill="#0f172a" font-family="monospace" font-size="12" font-weight="700">HN 474</text>

    <text x="80" y="142" fill="#64748b" font-family="monospace" font-size="8">GATE</text>
    <text x="80" y="158" fill="#0f172a" font-family="monospace" font-size="12" font-weight="700">12B</text>

    <text x="135" y="142" fill="#64748b" font-family="monospace" font-size="8">SEAT</text>
    <text x="135" y="158" fill="#0f172a" font-family="monospace" font-size="12" font-weight="700">14A</text>

    <text x="185" y="142" fill="#64748b" font-family="monospace" font-size="8">DURATION</text>
    <text x="185" y="158" fill="#0284c7" font-family="monospace" font-size="12" font-weight="800">2h 00m</text>

    <!-- Perforation line -->
    <line x1="260" y1="38" x2="260" y2="190" stroke="#b0a89a" stroke-width="1.5" stroke-dasharray="4,4"/>

    <!-- Stub (Tear off interaction) -->
    <text x="275" y="65" fill="#64748b" font-family="monospace" font-size="8">PASSENGER</text>
    <text x="275" y="80" fill="#0f172a" font-family="-apple-system, sans-serif" font-size="10" font-weight="700">HAN / S</text>

    <text x="275" y="105" fill="#64748b" font-family="monospace" font-size="8">SEAT</text>
    <text x="275" y="122" fill="#0f172a" font-family="monospace" font-size="14" font-weight="800">14A</text>

    <!-- Stub Barcode -->
    <g transform="translate(275, 138)">
      <rect x="0" y="0" width="2" height="34" fill="#0f172a"/>
      <rect x="4" y="0" width="4" height="34" fill="#0f172a"/>
      <rect x="11" y="0" width="1" height="34" fill="#0f172a"/>
      <rect x="14" y="0" width="3" height="34" fill="#0f172a"/>
      <rect x="20" y="0" width="5" height="34" fill="#0f172a"/>
      <rect x="28" y="0" width="2" height="34" fill="#0f172a"/>
      <rect x="33" y="0" width="4" height="34" fill="#0f172a"/>
      <rect x="40" y="0" width="2" height="34" fill="#0f172a"/>
      <rect x="44" y="0" width="6" height="34" fill="#0f172a"/>
      <rect x="54" y="0" width="3" height="34" fill="#0f172a"/>
      <rect x="60" y="0" width="2" height="34" fill="#0f172a"/>
      <rect x="65" y="0" width="4" height="34" fill="#0f172a"/>
    </g>
  </g>

  <!-- Card 2: 3D Luggage & Decals (Bottom Left) -->
  <g transform="translate(70, 310)" filter="url(#cardShadow)">
    <rect width="360" height="175" rx="8" fill="#131c2a" stroke="#25354e" stroke-width="1.5"/>
    <text x="20" y="30" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="0.5">SUITCASE &amp; STICKER COLLECTION</text>
    
    <!-- Mini Suitcase illustration -->
    <rect x="30" y="50" width="100" height="95" rx="14" fill="#1e293b" stroke="#475569" stroke-width="2.5"/>
    <line x1="55" y1="58" x2="55" y2="137" stroke="#334155" stroke-width="2"/>
    <line x1="80" y1="58" x2="80" y2="137" stroke="#334155" stroke-width="2"/>
    <line x1="105" y1="58" x2="105" y2="137" stroke="#334155" stroke-width="2"/>
    
    <!-- Stickers on suitcase -->
    <rect x="42" y="70" width="32" height="22" rx="3" fill="#ef4444" transform="rotate(-10 58 81)"/>
    <text x="48" y="85" fill="#ffffff" font-family="monospace" font-size="8" font-weight="900" transform="rotate(-10 58 81)">TYO</text>
    
    <circle cx="95" cy="110" r="14" fill="#0ea5e9"/>
    <text x="95" y="113" fill="#ffffff" font-family="sans-serif" font-size="8" font-weight="800" text-anchor="middle">PARIS</text>

    <!-- Info side -->
    <text x="150" y="72" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">Rimowa Classic 35L</text>
    <text x="150" y="92" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11">Capacity: 12 / 12 Stickers</text>
    <text x="150" y="112" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">✓ Fully Filled (+360 bonus miles)</text>
    
    <!-- Miles Badge -->
    <rect x="150" y="126" width="130" height="24" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="215" y="142" fill="#f59e0b" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">★ GOLD TIER (2,450 mi)</text>
  </g>

  <!-- Card 3: In-Flight Radar & Sound Monitor (Right Top) -->
  <g transform="translate(460, 95)" filter="url(#cardShadow)">
    <rect width="430" height="190" rx="8" fill="#131c2a" stroke="#25354e" stroke-width="1.5"/>
    
    <!-- Header status -->
    <circle cx="25" cy="25" r="4" fill="#10b981"/>
    <text x="38" y="29" fill="#10b981" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">CRUISING (FOCUS SESSION ACTIVE)</text>
    <text x="410" y="29" fill="#94a3b8" font-family="monospace" font-size="11" text-anchor="end">ALT: 35,000 FT</text>

    <!-- Instrument gauges -->
    <g transform="translate(25, 50)">
      <rect width="180" height="60" rx="6" fill="#0b1017" stroke="#1e293b" stroke-width="1"/>
      <text x="15" y="22" fill="#64748b" font-family="monospace" font-size="9">TIME REMAINING</text>
      <text x="15" y="48" fill="#38bdf8" font-family="monospace" font-size="20" font-weight="800">01:34:20</text>
      <text x="165" y="48" fill="#64748b" font-family="monospace" font-size="11" text-anchor="end">520 kts</text>
    </g>

    <g transform="translate(225, 50)">
      <rect width="180" height="60" rx="6" fill="#0b1017" stroke="#1e293b" stroke-width="1"/>
      <text x="15" y="22" fill="#64748b" font-family="monospace" font-size="9">CABIN ACOUSTIC TIMBRE</text>
      <text x="15" y="44" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="13" font-weight="700">Boeing 777-300ER</text>
      <text x="15" y="56" fill="#10b981" font-family="-apple-system, sans-serif" font-size="9">Focus Mode Active (-7dB rumble)</text>
    </g>

    <!-- Sound Waveform visualizer -->
    <g transform="translate(25, 125)">
      <rect width="380" height="48" rx="6" fill="#0b1017" stroke="#1e293b" stroke-width="1"/>
      <!-- Realistic noise frequency body curve -->
      <path d="M 15 36 Q 40 12, 80 20 T 150 28 T 220 22 T 300 32 L 365 35" fill="none" stroke="#38bdf8" stroke-width="2.5"/>
      <line x1="15" y1="38" x2="365" y2="38" stroke="#1e293b" stroke-width="1"/>
      <text x="25" y="18" fill="#64748b" font-family="monospace" font-size="8">AIRFLOW SPECTRUM</text>
      <text x="355" y="18" fill="#38bdf8" font-family="monospace" font-size="8" text-anchor="end">AudioWorklet Live</text>
    </g>
  </g>

  <!-- Card 4: Passport & Customs Stamps (Right Bottom) -->
  <g transform="translate(460, 310)" filter="url(#cardShadow)">
    <rect width="430" height="175" rx="8" fill="#fcf9f2" stroke="#d5cebf" stroke-width="1.5"/>
    
    <!-- Passport Page Watermark pattern -->
    <rect width="430" height="26" rx="8" fill="#e8e0d0"/>
    <rect y="18" width="430" height="8" fill="#e8e0d0"/>
    <text x="20" y="18" fill="#786f60" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" letter-spacing="1">PASSPORT / VISAS</text>
    <text x="410" y="18" fill="#786f60" font-family="monospace" font-size="10" text-anchor="end">PAGE 04 / 24</text>

    <!-- Stamps -->
    <!-- Stamp 1: Japan Entry (Blue Hexagon) -->
    <g transform="translate(35, 42)">
      <polygon points="12,0 78,0 90,30 78,60 12,60 0,30" fill="none" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="45,2"/>
      <text x="45" y="20" fill="#1d4ed8" font-family="-apple-system, sans-serif" font-size="9" font-weight="800" text-anchor="middle">JAPAN</text>
      <text x="45" y="34" fill="#1d4ed8" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">2026.10.27</text>
      <text x="45" y="48" fill="#1d4ed8" font-family="-apple-system, sans-serif" font-size="8" text-anchor="middle">NARITA (NRT)</text>
    </g>

    <!-- Stamp 2: France Schengen (Green Rectangle) -->
    <g transform="translate(145, 46) rotate(-6)">
      <rect width="85" height="52" rx="6" fill="none" stroke="#047857" stroke-width="2"/>
      <text x="42" y="16" fill="#047857" font-family="-apple-system, sans-serif" font-size="8" font-weight="800" text-anchor="middle">FRANCE - CDG</text>
      <text x="42" y="30" fill="#047857" font-family="monospace" font-size="10" font-weight="700" text-anchor="middle">21.10.26</text>
      <text x="42" y="44" fill="#047857" font-family="-apple-system, sans-serif" font-size="8" text-anchor="middle">ENTRÉE 04</text>
    </g>

    <!-- Stamp 3: United States (Red Oval) -->
    <g transform="translate(255, 40) rotate(5)">
      <ellipse cx="48" cy="30" rx="46" ry="26" fill="none" stroke="#b91c1c" stroke-width="2"/>
      <text x="48" y="24" fill="#b91c1c" font-family="-apple-system, sans-serif" font-size="8" font-weight="800" text-anchor="middle">U.S. IMMIGRATION</text>
      <text x="48" y="37" fill="#b91c1c" font-family="monospace" font-size="9" font-weight="700" text-anchor="middle">OCT 15 2026</text>
      <text x="48" y="47" fill="#b91c1c" font-family="-apple-system, sans-serif" font-size="7" text-anchor="middle">JFK CLASS: WT</text>
    </g>

    <!-- ICAO Machine Readable Zone (MRZ snippet) -->
    <g transform="translate(20, 126)">
      <rect width="390" height="34" rx="4" fill="#ece5d8"/>
      <text x="12" y="16" fill="#3f3b33" font-family="'Courier New', monospace" font-size="10" font-weight="700" letter-spacing="1">P&lt;KORHAN&lt;&lt;SEIDON&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;</text>
      <text x="12" y="28" fill="#3f3b33" font-family="'Courier New', monospace" font-size="10" font-weight="700" letter-spacing="1">CO74892147KOR9610258M3610255&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;02</text>
    </g>
  </g>
</svg>
