<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f141c"/>
      <stop offset="100%" stop-color="#18202d"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="760" height="380" rx="12" fill="url(#bgGrad)" stroke="#2b384e" stroke-width="1.5"/>

  <!-- Title & Subtitle -->
  <text x="35" y="42" fill="#f0f4fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" letter-spacing="0.2">
    Salivary Cortisol Concentrations during 2h Work Performance
  </text>
  <text x="35" y="64" fill="#8b9bb4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">
    Impact of Low-Frequency Noise (40 dBA) vs Reference Flat Noise on Noise-Sensitive Subjects (Persson Waye et al., 2002)
  </text>

  <!-- Grid Area: x: 80 to 680, y: 100 to 300 -->
  <g stroke="#243044" stroke-width="1" stroke-dasharray="3,3">
    <line x1="80" y1="100" x2="680" y2="100"/>
    <line x1="80" y1="150" x2="680" y2="150"/>
    <line x1="80" y1="200" x2="680" y2="200"/>
    <line x1="80" y1="250" x2="680" y2="250"/>
    <line x1="80" y1="300" x2="680" y2="300"/>
  </g>

  <!-- Axes -->
  <line x1="80" y1="100" x2="80" y2="300" stroke="#485c7b" stroke-width="1.5"/>
  <line x1="80" y1="300" x2="680" y2="300" stroke="#485c7b" stroke-width="1.5"/>

  <!-- Y-Axis Labels -->
  <text x="65" y="104" fill="#7d8fa9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="end">14</text>
  <text x="65" y="154" fill="#7d8fa9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="end">12</text>
  <text x="65" y="204" fill="#7d8fa9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="end">10</text>
  <text x="65" y="254" fill="#7d8fa9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="end">8</text>
  <text x="65" y="304" fill="#7d8fa9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="end">6</text>
  <text x="30" y="205" fill="#8b9bb4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" transform="rotate(-90 30 205)" text-anchor="middle">Cortisol (nmol / L)</text>

  <!-- X-Axis Labels -->
  <text x="180" y="324" fill="#f0f4fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" text-anchor="middle">0 min (Baseline)</text>
  <text x="580" y="324" fill="#f0f4fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" text-anchor="middle">120 min (After Work Task)</text>

  <!-- Tick Marks -->
  <line x1="180" y1="300" x2="180" y2="306" stroke="#485c7b" stroke-width="1.5"/>
  <line x1="580" y1="300" x2="580" y2="306" stroke="#485c7b" stroke-width="1.5"/>

  <!-- Shaded Area for Elevated Stress Delta -->
  <path d="M 180 170 L 580 192 L 580 280 L 180 175 Z" fill="#ef4444" fill-opacity="0.12"/>

  <!-- Line 1: Reference Noise (Circadian decline normal) -->
  <!-- 0 min: 11.0 nmol/L (y: 175), 120 min: 6.8 nmol/L (y: 280) -->
  <line x1="180" y1="175" x2="580" y2="280" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
  <!-- Data points -->
  <circle cx="180" cy="175" r="5" fill="#38bdf8" stroke="#0f141c" stroke-width="2"/>
  <circle cx="580" cy="280" r="5" fill="#38bdf8" stroke="#0f141c" stroke-width="2"/>
  <text x="592" y="284" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">6.8 nmol/L</text>

  <!-- Line 2: Low-Frequency Dominant Noise (Elevated / Attenuated drop) -->
  <!-- 0 min: 11.2 nmol/L (y: 170), 120 min: 10.3 nmol/L (y: 192) -->
  <line x1="180" y1="170" x2="580" y2="192" stroke="#f43f5e" stroke-width="3" stroke-linecap="round"/>
  <!-- Data points -->
  <circle cx="180" cy="170" r="5" fill="#f43f5e" stroke="#0f141c" stroke-width="2"/>
  <circle cx="580" cy="192" r="5" fill="#f43f5e" stroke="#0f141c" stroke-width="2"/>
  <text x="592" y="196" fill="#f43f5e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">10.3 nmol/L</text>

  <!-- Delta Annotation -->
  <line x1="560" y1="195" x2="560" y2="277" stroke="#fb7185" stroke-width="1.5" stroke-dasharray="2,2"/>
  <text x="548" y="240" fill="#fb7185" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="end">Attenuated decline (+51% stress level)</text>

  <!-- Legend -->
  <g transform="translate(140, 352)">
    <rect x="0" y="0" width="16" height="4" rx="2" fill="#f43f5e"/>
    <text x="24" y="6" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Low Frequency Ventilation Noise (LFN)</text>

    <rect x="260" y="0" width="16" height="4" rx="2" fill="#38bdf8"/>
    <text x="284" y="6" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Reference Flat Noise (Normal circadian recovery)</text>
  </g>
</svg>
