<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f141c"/>
      <stop offset="100%" stop-color="#18202d"/>
    </linearGradient>
    <linearGradient id="cutArea" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <!-- Background Card -->
  <rect width="760" height="380" rx="12" fill="url(#bgGrad2)" stroke="#2b384e" stroke-width="1.5"/>

  <!-- Title & Subtitle -->
  <text x="35" y="42" fill="#f0f4fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" letter-spacing="0.2">
    Focus Mode Acoustic Frequency Response
  </text>
  <text x="35" y="64" fill="#8b9bb4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">
    -7.0 dB Low-Shelf Attenuation targeting fatigue-inducing low-frequency rumble (&lt; 160 Hz)
  </text>

  <!-- Grid Area: x: 80 to 680, y: 100 to 290 -->
  <g stroke="#243044" stroke-width="1" stroke-dasharray="3,3">
    <line x1="80" y1="110" x2="680" y2="110"/>
    <line x1="80" y1="150" x2="680" y2="150"/>
    <line x1="80" y1="190" x2="680" y2="190"/>
    <line x1="80" y1="230" x2="680" y2="230"/>
    <line x1="80" y1="270" x2="680" y2="270"/>
  </g>

  <!-- Axes -->
  <line x1="80" y1="90" x2="80" y2="290" stroke="#485c7b" stroke-width="1.5"/>
  <line x1="80" y1="150" x2="680" y2="150" stroke="#64748b" stroke-width="1.5"/><!-- 0 dB Axis -->
  <line x1="80" y1="290" x2="680" y2="290" stroke="#485c7b" stroke-width="1.5"/>

  <!-- Y-Axis Labels -->
  <text x="65" y="114" fill="#7d8fa9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="end">+2 dB</text>
  <text x="65" y="154" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="end">0 dB</text>
  <text x="65" y="194" fill="#7d8fa9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="end">-3 dB</text>
  <text x="65" y="234" fill="#7d8fa9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="end">-6 dB</text>
  <text x="65" y="250" fill="#f43f5e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="end">-7 dB</text>
  <text x="30" y="190" fill="#8b9bb4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" transform="rotate(-90 30 190)" text-anchor="middle">Filter Gain (dB)</text>

  <!-- X-Axis Labels (Log scale approx: 20Hz=80, 50Hz=160, 100Hz=230, 160Hz=280, 320Hz=350, 1kHz=450, 4kHz=560, 20kHz=680) -->
  <text x="80" y="310" fill="#7d8fa9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle">20 Hz</text>
  <text x="160" y="310" fill="#7d8fa9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle">50 Hz</text>
  <text x="230" y="310" fill="#7d8fa9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle">80 Hz</text>
  <text x="280" y="310" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">160 Hz</text>
  <text x="350" y="310" fill="#7d8fa9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle">320 Hz</text>
  <text x="450" y="310" fill="#7d8fa9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle">1 kHz</text>
  <text x="560" y="310" fill="#7d8fa9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle">5 kHz</text>
  <text x="670" y="310" fill="#7d8fa9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle">20 kHz</text>

  <!-- Attenuation Area Shading -->
  <path d="M 80 150 L 80 245 L 230 245 C 260 245, 275 200, 350 150 Z" fill="url(#cutArea)"/>

  <!-- Curve 1: Standard Cabin Audio (Flat Reference 0 dB line) -->
  <line x1="80" y1="150" x2="680" y2="150" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6,4"/>

  <!-- Curve 2: Focus Mode Filter Curve -->
  <!-- 20-80Hz: -7dB (y: 245), 80-160Hz transition, 160Hz (-3.5dB y: 197), 320Hz+ flat at 0dB (y: 150) -->
  <path d="M 80 245 L 220 245 C 255 245, 275 200, 350 150 L 680 150" fill="none" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Annotations -->
  <circle cx="280" cy="197" r="4.5" fill="#38bdf8"/>
  <text x="292" y="192" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">-3.5 dB @ 160 Hz</text>

  <circle cx="160" cy="245" r="4.5" fill="#f43f5e"/>
  <text x="160" y="265" fill="#f43f5e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">-7.0 dB Low-Shelf</text>

  <!-- Airflow Body & Vent Noise annotation -->
  <rect x="370" y="105" width="290" height="34" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="515" y="126" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle">
    Full Body &amp; Vent Air Masking Retained (&gt; 320 Hz)
  </text>

  <!-- Legend -->
  <g transform="translate(160, 350)">
    <line x1="0" y1="5" x2="24" y2="5" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6,4"/>
    <text x="32" y="9" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Standard Cabin Audio (A320 / B737 / B777 IR)</text>

    <line x1="280" y1="5" x2="304" y2="5" stroke="#38bdf8" stroke-width="3.5"/>
    <text x="312" y="9" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Focus Mode (-7 dB Low-Shelf)</text>
  </g>
</svg>
