<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141a24"/>
      <stop offset="50%" stop-color="#1b2432"/>
      <stop offset="100%" stop-color="#0b0e14"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f6d365"/>
      <stop offset="100%" stop-color="#fda085"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- App Icon Squircle -->
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bg)" stroke="#2d3b52" stroke-width="3"/>
  <rect x="12" y="12" width="232" height="232" rx="52" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>

  <!-- Flight Path Arc -->
  <path d="M 40 180 C 70 80, 160 50, 210 70" fill="none" stroke="url(#accent)" stroke-width="3" stroke-dasharray="6,6" opacity="0.6"/>

  <!-- Suitcase Body -->
  <rect x="68" y="100" width="120" height="90" rx="18" fill="#1e293b" stroke="#475569" stroke-width="3.5"/>
  <!-- Suitcase Grooves (Ribs) -->
  <line x1="96" y1="108" x2="96" y2="182" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
  <line x1="128" y1="108" x2="128" y2="182" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
  <line x1="160" y1="108" x2="160" y2="182" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Suitcase Handle -->
  <path d="M 104 100 L 104 78 C 104 72, 108 68, 114 68 L 142 68 C 148 68, 152 72, 152 78 L 152 100" fill="none" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>

  <!-- Sticker on Suitcase -->
  <rect x="84" y="128" width="36" height="24" rx="4" fill="#f43f5e" transform="rotate(-12 102 140)"/>
  <text x="94" y="144" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="9" font-weight="900" transform="rotate(-12 102 140)" letter-spacing="0.5">TYO</text>

  <!-- Airplane Soaring -->
  <g transform="translate(142, 60) rotate(24) scale(0.9)" filter="url(#glow)">
    <path d="M 28 0 L 38 32 L 68 44 L 68 52 L 38 46 L 36 72 L 48 82 L 48 88 L 32 85 L 16 88 L 16 82 L 28 72 L 26 46 L -4 52 L -4 44 L 26 32 Z" fill="url(#gold)"/>
  </g>
</svg>
