  <rect x="209" y="330" width="18" height="80" rx="9" fill="#b9392a" opacity="0.75"/>
  <rect x="247" y="310" width="18" height="120" rx="9" fill="#b9392a"/>
  <rect x="285" y="330" width="18" height="80" rx="9" fill="#b9392a" opacity="0.75"/>
